<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>みんなの0円物件マップ</title>
    <meta
      name="description"
      content="zero.estate に掲載された0円物件を衛星写真の地図上に表示します。都道府県・種別・特記事項で絞り込めます。"
    />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css" />
    <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div id="map"></div>

    <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="panel">
      <span aria-hidden="true">☰</span> 絞り込み
    </button>

    <aside id="panel" class="panel" aria-label="絞り込みと一覧">
      <header class="panel__header">
        <div>
          <h1 class="panel__title">みんなの0円物件マップ</h1>
          <p class="panel__meta" id="meta">読み込み中…</p>
        </div>
        <button id="panel-close" class="panel__close" type="button" aria-label="パネルを閉じる">
          ×
        </button>
      </header>

      <div class="panel__body" id="panel-body">
        <section class="field">
          <label class="field__label" for="search">物件名・住所で検索</label>
          <input id="search" type="search" placeholder="例: 高山市 別荘" autocomplete="off" />
        </section>

        <section class="field">
          <h2 class="field__label">
            ステータス
            <button type="button" class="link-btn" id="status-reset">すべて</button>
          </h2>
          <div class="chips" id="statuses"></div>
        </section>

        <section class="field">
          <h2 class="field__label">
            種別
            <button type="button" class="link-btn" id="type-reset">すべて</button>
          </h2>
          <div class="chips" id="types"></div>
        </section>

        <section class="field field--row">
          <label class="field__inline">
            <span class="field__label">地方</span>
            <select id="region"></select>
          </label>
          <label class="field__inline">
            <span class="field__label">都道府県</span>
            <select id="pref"></select>
          </label>
        </section>

        <section class="field">
          <h2 class="field__label">
            特記事項
            <button type="button" class="link-btn" id="note-reset">すべて</button>
          </h2>
          <div class="chips chips--scroll" id="notes"></div>
        </section>

        <section class="field field--row">
          <label class="field__inline">
            <span class="field__label">並び順</span>
            <select id="sort">
              <option value="new">新着順</option>
              <option value="views">閲覧数が多い順</option>
              <option value="favorites">お気に入りが多い順</option>
            </select>
          </label>
          <label class="field__inline field__inline--check">
            <span class="field__label">表示範囲</span>
            <label class="check">
              <input type="checkbox" id="in-view" />
              <span>地図に写っている物件だけ一覧に出す</span>
            </label>
          </label>
        </section>

        <section class="field field--grow">
          <h2 class="field__label">一覧 <span class="count" id="count"></span></h2>
          <ol class="list" id="list"></ol>
        </section>
      </div>

      <footer class="panel__footer">
        物件データ: <span id="sources-credit"></span>
        <br />掲載内容は各サイトで確認してください
      </footer>
    </aside>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
