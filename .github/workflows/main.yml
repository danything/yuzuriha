name: Main

# 定期実行は停止中。zero.estate から取得する承諾が得られるまでは手動実行のみ
# （再開するときは以下を戻す）
#   schedule: [{cron: "0 0 * * *"}]
#   push: {branches: ["main"]}
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch properties and build map.json
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: bun app.ts
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html map.json site/
          cp -r assets site/assets
      - name: Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
