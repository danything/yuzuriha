name: Main
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

permissions:
  contents: read
  pages: write
  id-token: write

# Pages へのデプロイは同時に 1 つだけ。進行中のものは打ち切らずに待つ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # みんなの0円物件 (zero.estate) は承諾待ちのため取得しない。
      # data.json を作らなければ map.json にも入らない。
      # 1つの取得元が落ちても地図は出せるので、取得の失敗ではジョブを止めない
      - name: Fetch フィールドマッチング
        continue-on-error: true
        run: bun app.ts fetch fm
      - name: Fetch 負動産の掲示板
        continue-on-error: true
        env:
          # この2サイトは海外IPから 403 になるため、国内のプロキシを通す
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: bun app.ts fetch md
      - name: Fetch NISUMEL
        continue-on-error: true
        env:
          # この2サイトは海外IPから 403 になるため、国内のプロキシを通す
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: bun app.ts fetch ni
      - name: Fetch 家いちば
        continue-on-error: true
        run: bun app.ts fetch ie
      - name: Fetch 全国０円不動産
        continue-on-error: true
        run: bun app.ts fetch zz

      - name: Geocode missing coordinates
        run: bun app.ts geocode
      - name: Build map.json
        run: bun app.ts json
      - name: Build the frontend
        run: bun build-web.ts

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp data/map.json site/
          cp -r assets site/assets
          # 独自ドメイン。これが無いと Pages の設定が毎回リセットされる
          echo "y.doany.io" > site/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
