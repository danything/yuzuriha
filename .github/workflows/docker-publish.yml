# 自宅クラスタ (k3s/) が動かすイメージ。ArgoCD が k3s/deployment.yaml の
# タグを見て同期する（下の bump ステップ参照）。
name: Build and Push Docker Image

on:
  push: {branches: ["main"]}
  workflow_dispatch:

# 新しいコミットのイメージだけあればいいので、古い実行は打ち切る
concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      # ghcr のリポジトリ名は小文字しか受け付けない
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ArgoCD は latest の中身が変わっただけでは同期しない（マニフェストに
      # 差分が無いため）。k3s/deployment.yaml のタグをこのビルドの sha に
      # 書き換えて main に直接コミットすると、そこが差分になって自動で
      # ロールアウトする。main は保護されていないので PR は要らない。
      # push は GITHUB_TOKEN で行うため、このワークフロー自体は再トリガーされない。
      - name: Bump the deployed image tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s#image: ${REGISTRY}/[^:[:space:]]*/yuzuriha:[^[:space:]]*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" k3s/deployment.yaml
          if git diff --quiet -- k3s/deployment.yaml; then
            echo "k3s/deployment.yaml already points at ${GITHUB_SHA}; nothing to commit"
            exit 0
          fi
          git add k3s/deployment.yaml
          git commit -m "Point the deployment at ${GITHUB_SHA::7}"
          git push origin HEAD:main
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
