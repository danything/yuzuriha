# 自宅クラスタ (k3s/) が動かすイメージ。Pages への公開とは別物で、
# こちらは移管後に ArgoCD が拾うまで誰も使わない。
name: Build and Push Docker Image

on:
  push: {branches: ["main"]}
  workflow_dispatch:

# 新しいコミットのイメージだけあればいいので、古い実行は打ち切る
concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # ghcr のリポジトリ名は小文字しか受け付けない
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # k3s/deployment.yaml は latest を imagePullPolicy: Always で引くので、
      # 入れ替えは kubectl rollout restart deployment/yuzuriha で足りる。
      # sha のタグは戻したいときのために残す。
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
