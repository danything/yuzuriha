apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yuzuriha
  namespace: yuzuriha
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: mydnschallenge
    # Bun serves uncompressed; Traefik compresses on the way out.
    traefik.ingress.kubernetes.io/router.middlewares: yuzuriha-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - y.doany.io
  rules:
    # Cut over from GitHub Pages: the DNS record now points here, and the
    # Pages site (and its custom domain, so the 5ym.github.io/zero-owner/
    # redirect アキソル was given) has been deleted from GitHub.
    - host: y.doany.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yuzuriha
                port:
                  number: 80
