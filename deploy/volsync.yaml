# Back up this app's PVC to R2 with VolSync (one restic repository per PVC: `<bucket>/volsync/yuzuriha/<pvc>`).
# The Secret (volsync-<pvc>) is in secrets.sops.yaml. How and when: danything/gitops, deploy/volsync/application.yaml.
# It lives with the app, so removing the app removes this too (the R2 repository stays; see "やめる"
# in gitops deploy/backup/README.md). A new PVC needs one more ReplicationSource and volsync-<pvc> in secrets.sops.yaml.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: yuzuriha-data
  namespace: yuzuriha
spec:
  sourcePVC: yuzuriha-data
  trigger:
    schedule: "0 19 * * *"
  restic:
    repository: volsync-yuzuriha-data
    copyMethod: Snapshot
    retain: { daily: 7, weekly: 4, monthly: 6 }
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
---
# 戻す側(populator)。PVC yuzuriha-data の dataSourceRef がこれを指すので、PVC を新しく作ると R2 の最新から中身を埋めてから渡す
# (入れ直したクラスタ・PVC を消して作り直したとき)。今ある PVC には効かない。作られたときに 1 回だけ戻す
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: yuzuriha-data-dst
  namespace: yuzuriha
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-yuzuriha-data
    copyMethod: Snapshot
    capacity: 2Gi
    accessModes: [ReadWriteOnce]
    storageClassName: local-path
    moverSecurityContext: { runAsUser: 0, runAsGroup: 0 }
    # 戻した中身はスナップショットに残るので、作業用の PVC は消す
    cleanupTempPVC: true
    cleanupCachePVC: true
