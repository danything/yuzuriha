# The fetched data: each source's raw JSON, the geocode cache and the map.json
# built from them. Retained on delete because losing the cache means asking
# 国土地理院 for every address again, one request at a time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yuzuriha-data
  namespace: yuzuriha
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
