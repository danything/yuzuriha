# The fetched data: each source's raw JSON, the geocode cache and the map.json
# built from them. Losing the cache means asking 国土地理院 for every address
# again, one request at a time, so the daily backup is what stands behind it.
# That backup is a VolSync snapshot of the whole PVC (danything/gitops,
# deploy/volsync/application.yaml), declared next to this file in volsync.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yuzuriha-data
  namespace: yuzuriha
spec:
  # 新しく作るときは VolSync が R2 の最新から中身を埋める(volsync.yaml の yuzuriha-data-dst)。今ある PVC には効かない
  dataSourceRef:
    {
      apiGroup: volsync.backube,
      kind: ReplicationDestination,
      name: yuzuriha-data-dst,
    }
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
