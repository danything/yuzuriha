# The fetched data: each source's raw JSON, the geocode cache and the map.json
# built from them. Losing the cache means asking 国土地理院 for every address
# again, one request at a time, so the daily backup is what stands behind it.
# That backup is a VolSync snapshot of the whole PVC (danything/gitops,
# deploy/volsync/application.yaml); nothing here needs to opt in.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yuzuriha-data
  namespace: yuzuriha
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
