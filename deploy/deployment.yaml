# One process does everything: it serves the site and rebuilds map.json on its
# own schedule (Bun.cron inside server.ts). There is no separate CronJob and no
# web server in front of it -- an earlier draft had Caddy plus a CronJob that
# cloned the repo and ran the build, which meant two images, a shared volume and
# a document root to keep in sync for a site that is one HTML file.
#
# Running the build here rather than in GitHub Actions is the point: 負動産の掲示板
# and NISUMEL are WordPress sites on Japanese hosting that answer wp-json with
# 403 to overseas addresses, which is why the Actions build has to go through the
# 3proxy in this cluster. From here the requests already come from a Japanese
# address, so no proxy is involved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yuzuriha
  namespace: yuzuriha
spec:
  replicas: 1
  # The PVC is ReadWriteOnce and holds the fetched data, so don't run two pods
  # over it at once. The site is static and comes back in a second or two, which
  # is cheaper than arranging a handover for it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: yuzuriha
  template:
    metadata:
      labels:
        app: yuzuriha
    spec:
      # The volume is created by whichever uid the image runs as; naming the
      # group here has the kubelet line it up on mount so the data directory
      # stays writable if that uid ever moves. OnRootMismatch skips the walk
      # when the top-level directory already matches.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: yuzuriha
          # Built, pushed, and this tag bumped by
          # .github/workflows/docker-publish.yml on every push to main --
          # ArgoCD picks up the change here and rolls it out on its own.
          image: ghcr.io/danything/yuzuriha:608a12dc853caf02111661689efbe1f609fd5cec
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          env:
            - name: TZ
              value: Asia/Tokyo
            # Rebuild every morning at 9. Fetching all five sources takes a few
            # minutes; Bun.cron will not start a second run on top of one that
            # is still going.
            - name: BUILD_CRON
              value: "0 9 * * *"
          # The first build on an empty volume takes minutes, and until it
          # finishes there is no map.json -- so probe the page, not the data.
          readinessProbe:
            httpGet:
              path: /index.html
              port: 5173
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 5173
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            # Raw responses, the geocode cache and map.json. Everything else in
            # the image is read-only.
            - name: data
              mountPath: /usr/src/app/data
            # The root filesystem is read-only; give it somewhere to write.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # A build holds every source's raw JSON in memory at once.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yuzuriha-data
        - name: tmp
          emptyDir: {}
